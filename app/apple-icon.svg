  <rect width="180" height="180" rx="40" fill="#f9f9f6"/>
  <!-- larger tab / touch — increased fill ~75% -->
  <text x="50%" y="53%" dominant-baseline="central" text-anchor="middle" font-family="'Great Vibes','Allura','Snell Roundhand','Brush Script MT','Segoe Script',cursive" font-size="132" font-style="italic" font-weight="400" letter-spacing="-0.02em">m</text>
</svg>
