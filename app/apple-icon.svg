<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180" fill="none" role="img" aria-label="Magicworks m">
  <style>
    rect{fill:#f9f9f6}
    text{fill:#4f46e5}
    @media (prefers-color-scheme: dark){
      rect{fill:#0c0c0c}
      text{fill:#818cf8}
    }
